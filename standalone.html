<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>北京地铁之“挤门遁甲” · 用最离谱的方式挤进去</title>
<meta name="description" content="四关沙雕物理小游戏：缩骨功、气流借力、道具流、西二旗早高峰。用最离谱的方式挤上北京地铁。" />
<!-- 单文件版：CSS / JS 全部内联，零外部依赖 -->
<style>
/* 北京地铁挤车 —— 地铁海报 / 线路图风格 */
:root{
  --red:#d92b2b;
  --red-dark:#a91d1d;
  --ink:#20242c;
  --ink-2:#5b6270;
  --paper:#f6f2e9;
  --card:#fffdf7;
  --line:#e3dccd;
  --yellow:#f5c518;
  --blue:#2f6fb5;
  --green:#2e9c6a;
  --shadow:0 10px 0 rgba(32,36,44,.10), 0 18px 40px rgba(32,36,44,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at 12% 8%, rgba(217,43,43,.07), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(47,111,181,.08), transparent 42%),
    repeating-linear-gradient(0deg, transparent 0 38px, rgba(32,36,44,.028) 38px 39px),
    var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:18px;
}
.app{width:min(100%,1040px);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:23px;letter-spacing:-2px;
  box-shadow:0 4px 0 var(--red-dark);border:3px solid #fff;
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:19px;letter-spacing:.5px}
.brand-text span{font-size:10.5px;color:var(--ink-2);letter-spacing:1.4px;margin-top:3px;font-weight:700}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:2px solid var(--ink);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.3px;
  padding:8px 13px;border-radius:999px;cursor:pointer;
  box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .12s;
}
.chip:hover{background:#fff2c9;transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.chip.off{opacity:.55}

.stage{
  position:relative;width:100%;aspect-ratio:960/600;background:#dfe6e4;
  border:4px solid var(--ink);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);
}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:9px 16px;margin-bottom:10px;
  background:var(--card);border:3px solid var(--ink);border-radius:12px;
  box-shadow:0 4px 0 var(--ink);
}
.hud.hide{display:none}
.hud-left{min-width:150px}
.hud-level{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--red)}
.hud-title{font-size:21px;font-weight:900;line-height:1.1;margin-top:2px}
.hud-mid{flex:1;max-width:390px;padding-top:2px}
.meter-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.meter-head b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter-track{height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.meter-fill{height:100%;width:100%;background:linear-gradient(90deg,#f5c518,#e8632a);transition:width .18s ease;border-radius:99px}
.meter-fill.danger{background:linear-gradient(90deg,#e8632a,#d92b2b)}
.hud-tip{font-size:11px;color:var(--ink-2);margin-top:6px;font-weight:700;min-height:15px}
.hud-right{text-align:right;min-width:110px}
.hud-timer{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px}
.hud-timer.urgent{color:var(--red);animation:blink .5s infinite alternate}
.hud-timer-label{font-size:10px;color:var(--ink-2);font-weight:800;margin-top:3px;letter-spacing:.6px}
@keyframes blink{from{opacity:1}to{opacity:.45}}

/* ---------- 覆盖层 ---------- */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(24,29,36,.55);backdrop-filter:blur(3px);overflow:auto}
.overlay.show{display:flex}
.panel{
  width:min(100%,720px);background:var(--card);border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 12px 0 rgba(32,36,44,.25);padding:26px 30px 24px;position:relative;
  animation:popin .28s cubic-bezier(.2,1.5,.5,1);
}
@keyframes popin{from{transform:scale(.88) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,var(--red) 0 26px,#fff 26px 34px);border-bottom:3px solid var(--ink);border-radius:15px 15px 0 0}
.eyebrow{display:inline-block;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff;background:var(--red);padding:5px 11px;border-radius:99px;margin-top:8px}
.panel h1{font-size:40px;line-height:1.08;margin:14px 0 8px;letter-spacing:-1.5px;font-weight:900}
.panel h1 em{font-style:normal;color:var(--red)}
.panel h2{font-size:27px;margin:12px 0 10px;font-weight:900;letter-spacing:-.5px}
.panel p{font-size:14px;line-height:1.85;color:var(--ink-2);margin:8px 0}
.panel p.lead{font-size:15px;color:var(--ink);font-weight:700}
.panel .quote{border-left:5px solid var(--yellow);padding:8px 14px;background:#fff8e1;border-radius:0 8px 8px 0;color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.7}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{
  border:3px solid var(--ink);background:var(--red);color:#fff;font-family:inherit;
  font-weight:900;font-size:16px;letter-spacing:1px;padding:12px 24px;border-radius:12px;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s,filter .1s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.small{font-size:13px;padding:9px 16px;box-shadow:0 4px 0 var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}

/* 选关卡片 */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
@media (max-width:720px){.levels{grid-template-columns:repeat(2,1fr)}.panel h1{font-size:30px}.panel{padding:20px}}
.lv{
  border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 11px;cursor:pointer;text-align:left;
  font-family:inherit;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;
}
.lv:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lv .n{font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--red)}
.lv .t{font-size:15px;font-weight:900;margin:5px 0 4px;line-height:1.25}
.lv .d{font-size:10.5px;color:var(--ink-2);line-height:1.5}
.lv .best{font-size:10px;font-weight:800;color:var(--green);margin-top:7px}
.lv.locked{opacity:.5;cursor:not-allowed;background:#eee9df;filter:grayscale(.7)}
.lv.locked:hover{transform:none;box-shadow:0 4px 0 var(--ink)}
.lv .lock{position:absolute;right:9px;top:9px;font-size:14px}

/* 结算 / 统计 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}
.stat{background:#f2eee3;border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--ink-2);font-weight:800;letter-spacing:.5px}
.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:7px 16px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--ink);transform:rotate(-2deg)}
.lines{font-size:13px;line-height:1.9;color:var(--ink-2)}
.lines b{color:var(--ink)}

/* 虚构通勤台播报 */
.news{background:#12283f;border:4px solid #fff;outline:3px solid #2a4f7c;border-radius:6px;padding:20px 22px;color:#fff;width:min(100%,720px);box-shadow:0 14px 0 rgba(0,0,0,.3)}
.news-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,255,255,.25);padding-bottom:10px;margin-bottom:14px}
.news-head b{font-size:18px;letter-spacing:5px;color:#9fd0ff}
.news-head span{font-size:11px;letter-spacing:2px;color:#a9c2e0}
.news-body{font-size:17px;line-height:2;min-height:110px;font-weight:700;letter-spacing:.5px}
.news-body .cur{display:inline-block;width:9px;height:19px;background:#9fd0ff;vertical-align:-3px;animation:blink .5s infinite alternate}
.news-foot{margin-top:12px;font-size:11px;color:#8fb0d6;letter-spacing:1px}
.news-ticker{margin-top:14px;background:#2a4f7c;color:#fff;font-size:12px;font-weight:900;padding:7px 10px;border-radius:3px;letter-spacing:1px;overflow:hidden;white-space:nowrap}

.toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-12px);background:rgba(32,36,44,.94);color:#fff;
  padding:7px 16px;border-radius:99px;font-size:11.5px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.footer{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:10.5px;color:var(--ink-2);font-weight:700;flex-wrap:wrap}
.footer b{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.footer-right{opacity:.8}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text">
        <strong>北京地铁之“挤门遁甲”</strong>
        <span>SQUEEZE SIMULATOR · 早高峰行为艺术</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnSound" class="chip" title="开关音效">♪ 音效 开</button>
      <button id="btnHelp" class="chip" title="玩法说明">? 玩法</button>
      <button id="btnHome" class="chip" title="返回首页">⌂ 选关</button>
    </div>
  </header>

  <div class="hud" id="hud">
    <div class="hud-left">
      <div class="hud-level" id="hudLevel">关卡 01</div>
      <div class="hud-title" id="hudTitle">缩骨功</div>
    </div>
    <div class="hud-mid">
      <div class="meter-head"><span id="meterLabel">尊严值</span><b id="meterText">100%</b></div>
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      <div class="hud-tip" id="hudTip">按提示操作</div>
    </div>
    <div class="hud-right">
      <div class="hud-timer" id="hudTimer">30.0</div>
      <div class="hud-timer-label" id="hudTimerLabel">关门倒计时</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="960" height="600"></canvas>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
  </div>

  <footer class="footer">
    <span>操作：鼠标 / 触摸 · <b>A D</b> 或 <b>← →</b> 移动 · <b>空格</b> 蓄力 / 缩骨 · <b>R</b> 重来</span>
    <span class="footer-right">纯属虚构 · 数字与播报均为游戏设定 · 无地域指向 · 献给每个早高峰通勤者</span>
  </footer>
</div>

<script>
/* ==========================================================
   北京地铁挤车 · 引擎层
   Canvas 2D + 自研「软体人群」弹簧物理（零依赖，离线可玩）
   ========================================================== */
(function () {
  'use strict';

  var W = 960, H = 600;
  var canvas, ctx, stage, overlay, toastEl, hudEl;
  var dpr = 1, lastT = 0, rafId = 0;

  /* ---------------- 工具 ---------------- */
  var U = {
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    rand: function (a, b) { return a + Math.random() * (b - a); },
    rnd: function (a, b) { return Math.floor(U.rand(a, b + 1)); },
    choice: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    dist: function (x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); },
    ease: function (t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
    easeOut: function (t) { return 1 - Math.pow(1 - t, 3); },
    approach: function (v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); },
    wrapText: function (text, n) {
      var out = [], line = '';
      for (var i = 0; i < text.length; i++) {
        line += text[i];
        if (line.length >= n) { out.push(line); line = ''; }
      }
      if (line) out.push(line);
      return out;
    }
  };

  /* ---------------- 合成音效（WebAudio，无外部资源） ---------------- */
  var AC = null, muted = false;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || .13, t0 + Math.min(.02, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(dur, vol, cut, delay) {
    if (muted) return;
    var a = ac(); if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = a.createBufferSource(); s.buffer = buf;
    var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut || 1800;
    var g = a.createGain(); g.gain.value = vol || .1;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0);
  }
  var sfx = {
    unlock: function () { ac(); },
    setMuted: function (m) { muted = m; },
    isMuted: function () { return muted; },
    squeak: function () { tone(420, .26, 'sawtooth', .09, 1150); tone(880, .2, 'square', .035, 1700); noise(.14, .05, 2600); },
    pop: function () { tone(180, .11, 'sine', .13, 420); noise(.05, .05, 900); },
    thud: function () { tone(120, .18, 'triangle', .17, 55); noise(.12, .07, 500); },
    boing: function () { tone(240, .38, 'sine', .13, 90); tone(480, .3, 'triangle', .05, 150); },
    hit: function () { noise(.1, .11, 700); tone(90, .14, 'square', .09, 50); },
    gasp: function () { noise(.5, .045, 1100); tone(300, .45, 'sine', .04, 520); },
    whoosh: function () { noise(.34, .085, 2400); tone(600, .3, 'sine', .03, 130); },
    ding: function () { tone(880, .1, 'sine', .1); tone(1320, .16, 'sine', .07, null, .09); },
    success: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, .22, 'triangle', .11, null, i * .09); }); },
    fail: function () { [400, 340, 270, 190].forEach(function (f, i) { tone(f, .2, 'sawtooth', .07, null, i * .1); }); },
    tick: function () { tone(1200, .045, 'square', .035); },
    clampDoor: function () { sfx.squeak(); sfx.thud(); },
    news: function () { tone(180, .8, 'sine', .05, 170); noise(.8, .02, 500); },
    burp: function () { tone(110, .35, 'sawtooth', .09, 62); noise(.2, .04, 400); }
  };

  /* ---------------- 特效：震屏 / 粒子 / 气泡 / 飘字 ---------------- */
  var FX = {
    shakeAmt: 0, shakeT: 0,
    parts: [], bubbles: [], floats: [],
    shake: function (n) { FX.shakeAmt = Math.max(FX.shakeAmt, n || 6); FX.shakeT = .32; },
    burst: function (x, y, color, count, opt) {
      opt = opt || {};
      for (var i = 0; i < (count || 12); i++) {
        var a = opt.angle != null ? opt.angle + U.rand(-.7, .7) : U.rand(0, Math.PI * 2);
        var sp = U.rand(opt.minSpeed || 60, opt.maxSpeed || 240);
        FX.parts.push({
          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.lift || 0),
          life: U.rand(.35, .85), max: .85, color: color, size: U.rand(3, opt.size || 8),
          spin: U.rand(-8, 8), rot: 0, star: opt.star || false, gravity: opt.gravity == null ? 420 : opt.gravity
        });
      }
    },
    bubble: function (x, y, text, opt) {
      opt = opt || {};
      FX.bubbles.push({ x: x, y: y, text: text, life: opt.life || 2.4, max: opt.life || 2.4, color: opt.color || '#20242c', bg: opt.bg || '#fffdf7', w: opt.w || 0, side: opt.side || 'right', scale: 0 });
    },
    float: function (x, y, text, color, size) {
      FX.floats.push({ x: x, y: y, text: text, color: color || '#d92b2b', life: 1.1, max: 1.1, size: size || 22 });
    },
    clear: function () { FX.parts.length = 0; FX.bubbles.length = 0; FX.floats.length = 0; FX.shakeAmt = 0; FX.shakeT = 0; },
    update: function (dt) {
      if (FX.shakeT > 0) { FX.shakeT -= dt; FX.shakeAmt *= Math.pow(.02, dt); if (FX.shakeT <= 0) FX.shakeAmt = 0; }
      var i, p;
      for (i = FX.parts.length - 1; i >= 0; i--) {
        p = FX.parts[i]; p.life -= dt;
        if (p.life <= 0) { FX.parts.splice(i, 1); continue; }
        p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      }
      for (i = FX.bubbles.length - 1; i >= 0; i--) {
        p = FX.bubbles[i]; p.life -= dt; p.scale = U.lerp(p.scale, 1, Math.min(1, dt * 14));
        if (p.life <= 0) FX.bubbles.splice(i, 1);
      }
      for (i = FX.floats.length - 1; i >= 0; i--) {
        p = FX.floats[i]; p.life -= dt; p.y -= 46 * dt;
        if (p.life <= 0) FX.floats.splice(i, 1);
      }
    },
    draw: function (c) {
      var i, p;
      for (i = 0; i < FX.parts.length; i++) {
        p = FX.parts[i];
        c.save(); c.globalAlpha = U.clamp(p.life / p.max * 1.4, 0, 1);
        c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
        if (p.star) {
          c.beginPath();
          for (var k = 0; k < 10; k++) {
            var r = k % 2 ? p.size * .45 : p.size;
            var a = k * Math.PI / 5 - Math.PI / 2;
            c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          c.closePath(); c.fill();
        } else { c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); }
        c.restore();
      }
      for (i = 0; i < FX.floats.length; i++) {
        p = FX.floats[i];
        c.save(); c.globalAlpha = U.clamp(p.life / p.max, 0, 1);
        c.font = '900 ' + p.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.9)';
        c.strokeText(p.text, p.x, p.y); c.fillStyle = p.color; c.fillText(p.text, p.x, p.y);
        c.restore();
      }
      for (i = 0; i < FX.bubbles.length; i++) {

  /* low-poly 卡通人物：以 (x,y) 为脚底中心，高约 118*s */
  function drawPerson(c, x, y, o) {

      c.beginPath(); c.arc(0, -94, 3, 0, Math.PI); c.stroke();

      c.beginPath(); c.arc(-7, -103, 2.6, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(7, -103, 2.6, 0, Math.PI * 2); c.fill();
      c.lineWidth = 2; c.strokeStyle = ink; c.beginPath();

      '<p><b>④ 西二旗早高峰</b>　左右滑动 / A D 在静止的人体之间穿梭，按住空格缩骨变瘦。别碰胳膊肘，别碰头发。挤到车门会有惊喜播报。</p>' +
      '<div class="quote">快捷键：R 重来 · M 静音 · Esc 返回选关 · 空格蓄力/缩骨</div>' +
      '<div class="btnrow">' + panelBtn('back', '知道了', 'ghost') + '</div>' +
      '</div>');
  }

  function showResult(ok, info) {
    var l = G.current;
    var nextBtn = ok && G.index + 1 < G.levels.length ? panelBtn('next', '下一关 →') : (ok ? panelBtn('final', '查看通勤总结 →', 'yellow') : '');
    var stats = '<div class="stats">' +
      '<div class="stat"><b>' + G.elapsed.toFixed(1) + 's</b><span>本关用时</span></div>' +
      '<div class="stat"><b>' + (info.mistakes || 0) + '</b><span>社死次数</span></div>' +
      '<div class="stat"><b>' + (info.dignity == null ? 100 : Math.round(info.dignity)) + '</b><span>剩余尊严</span></div>' +
      '<div class="stat"><b>' + (ok ? '✔' : '✘') + '</b><span>是否上车</span></div></div>';
    showOverlay('<div class="panel">' +
      '<span class="eyebrow" style="background:' + (ok ? '#2e9c6a' : '#d92b2b') + '">' + (ok ? 'MISSION COMPLETE' : 'MISSION FAILED') + '</span>' +
      '<h2>' + (ok ? '挤进去了！' : '没挤上去。') + '</h2>' +
      '<p class="lead">' + (ok ? (info.comment || '你和车门达成了某种不体面但有效的共识。') : (info.reason || '车门无情地关上了，你和站台一起留在了原地。')) + '</p>' +
      (ok ? '<div style="margin:10px 0 4px"><span class="badge">🏅 ' + (info.title || '门缝艺术家') + '</span></div>' : '') +
      stats +
      '<div class="lines">' + (ok ? ('<b>列车广播：</b>' + (info.announce || '请勿倚靠车门，虽然你已经倚了。')) : ('<b>后车乘客：</b>' + (info.taunt || '「这哥们儿刚才是不是想用肚子吸进去？」'))) + '</div>' +
      '<div class="btnrow">' + nextBtn + panelBtn('retry', '↻ 再来一次', 'ghost small') + panelBtn('home', '选关', 'ghost small') + '</div>' +
      '</div>');
  }

  function finalTitle(stats) {
    var total = stats.reduce(function (a, b) { return a + (b ? b.time : 0); }, 0);
    var miss = stats.reduce(function (a, b) { return a + (b ? b.mistakes : 0); }, 0);
    if (miss === 0) return '零失误 · 人体润滑油';
    if (total < 55) return '西二旗之字形战士';
    if (miss > 10) return '社会学田野调查样本';
    return '额定载客 151 / 100';
  }
  function showFinale() {
    save.runs += 1; writeSave();
    var total = G.runStats.reduce(function (a, b) { return a + (b ? b.time : 0); }, 0);
    var miss = G.runStats.reduce(function (a, b) { return a + (b ? b.mistakes : 0); }, 0);
    var rows = G.levels.map(function (l, i) {
      var s = G.runStats[i];
      return '<p>· <b>0' + (i + 1) + ' ' + l.name + '</b>　' + (s ? (s.time.toFixed(1) + 's · 社死 ' + s.mistakes + ' 次 · 「' + s.title + '」') : '本次未挑战') + '</p>';
    }).join('');
    showOverlay('<div class="panel">' +
      '<span class="eyebrow">通勤总结报告</span>' +
      '<h2>恭喜，您已完成一次完整的早高峰</h2>' +
      '<p class="lead">全程 ' + total.toFixed(1) + ' 秒，社死 ' + miss + ' 次。您没有迟到，因为系统在播报里替您取消了「准时」这个概念。</p>' +
      '<div style="margin:12px 0"><span class="badge">🏆 ' + finalTitle(G.runStats) + '</span></div>' +
      '<div class="lines">' + rows + '</div>' +
      '<div class="quote">游戏提示：车门关闭时请勿强行上下车。当然，我们说了四关您也没听。</div>' +
      '<div class="btnrow">' + panelBtn('again', '↻ 再挤一次') + panelBtn('home', '选关', 'ghost small') + '</div>' +
      '</div>');
  }

  function showNews(done) {
    var text = '各位乘客，本次列车因超载未能关门。系统已为您自动播放下一站：迟到。';
    var ticker = '虚构快讯：本站今日共完成 3,412 次缩骨功 · 钓鱼竿收缴量同比上升 270% · 额定 100 人 / 实际 151 人（均为游戏设定）';
    showOverlay('<div class="news" id="newsBox">' +
      '<div class="news-head"><b>早高峰通勤台 · 虚构播报</b><span>本台并不存在 · 请勿当真</span></div>' +
      '<div class="news-body"><span id="newsText"></span><span class="cur" id="newsCur"></span></div>' +
      '<div class="news-foot">本播报为游戏内虚构内容，与任何现实机构、线路及运营数据无关 · 画面中人物均有正式工作</div>' +
      '<div class="news-ticker">' + ticker + '</div>' +
      '<div class="btnrow" id="newsBtn" style="display:none">' + panelBtn('newsdone', '领取我的迟到 →', 'yellow small') + '</div>' +
      '</div>');
    sfx.news();
    var el = document.getElementById('newsText'), cur = document.getElementById('newsCur'), i = 0;
    var timer = setInterval(function () {
      if (!document.getElementById('newsText')) { clearInterval(timer); return; }
      el.textContent = text.slice(0, ++i);
      if (i % 3 === 0) sfx.tick();
      if (i >= text.length) {
        clearInterval(timer); cur.style.display = 'none';
        var b = document.getElementById('newsBtn'); if (b) b.style.display = 'flex';
      }
    }, 78);
    document.getElementById('newsBox').addEventListener('click', function () {
      if (i < text.length) {
        clearInterval(timer); i = text.length; el.textContent = text; cur.style.display = 'none';
        var b = document.getElementById('newsBtn'); if (b) b.style.display = 'flex';
      }
    });
    G._newsDone = done || showFinale;
  }

  /* ---------------- 覆盖层事件委托 ---------------- */
  function onOverlay(e) {
    var lv = e.target.closest ? e.target.closest('[data-lv]') : null;
    if (lv && !lv.disabled) { G._pending = parseInt(lv.getAttribute('data-lv'), 10); showBrief(G._pending); return; }
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var a = b.getAttribute('data-act');
    sfx.unlock();
    if (a === 'play' || a === 'again') { G.startRun(0); }
    else if (a === 'go') { hideOverlay(); G.startLevel(G._pending == null ? 0 : G._pending); }
    else if (a === 'next') { var n = G.index + 1; G._pending = n; showBrief(n); }
    else if (a === 'final') { showFinale(); }
    else if (a === 'newsdone') { if (G._newsDone) G._newsDone(); }
    else if (a === 'retry') { G.startLevel(G.index); }
    else if (a === 'home' || a === 'back') {
      if (G._helpFromPlay) { G._helpFromPlay = false; hideOverlay(); G.state = 'play'; }
      else G.title();
    }
    else if (a === 'help') { G._helpFromPlay = false; showHelp(); }
  }

  /* ---------------- 输入 ---------------- */
  function toLocal(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault(); sfx.unlock();
      var p = toLocal(e); G.pointer.x = p.x; G.pointer.y = p.y; G.pointer.down = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
      if (G.state === 'play' && G.current && G.current.down) G.current.down(p.x, p.y);
    });
    canvas.addEventListener('pointermove', function (e) {
      var p = toLocal(e); G.pointer.x = p.x; G.pointer.y = p.y;
      if (G.state === 'play' && G.current && G.current.move) G.current.move(p.x, p.y, G.pointer.down);
    });
    function up(e) {
      var p = toLocal(e); G.pointer.down = false; G.keys.Space = false;
      if (G.state === 'play' && G.current && G.current.up) G.current.up(p.x, p.y);
    }
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    window.addEventListener('keydown', function (e) {
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.code) >= 0) e.preventDefault();
      sfx.unlock();
      G.keys[e.code] = true;
      if (e.repeat) return;
      if (e.code === 'KeyM') { toggleSound(); return; }
      if (e.code === 'KeyR' && G.state === 'play') { G.startLevel(G.index); return; }
      if (e.code === 'Escape') { G.title(); return; }
      if (G.state === 'play' && G.current && G.current.key) G.current.key(e.code, true);
    });
    window.addEventListener('keyup', function (e) {
      G.keys[e.code] = false;
      if (G.state === 'play' && G.current && G.current.key) G.current.key(e.code, false);
    });
    window.addEventListener('blur', function () { G.keys = {}; G.pointer.down = false; });
  }

  function toggleSound() {
    muted = !muted; sfx.setMuted(muted);
    var b = document.getElementById('btnSound');
    b.textContent = muted ? '♪ 音效 关' : '♪ 音效 开';
    b.classList.toggle('off', muted);
  }

  /* ---------------- 主循环 ---------------- */
  function tick(t) {
    var dt = Math.min((t - lastT) / 1000, .045); lastT = t;
    if (dt < 0) dt = 0;
    FX.update(dt);
    if (G.state === 'play' && G.current) {
      G.elapsed += dt;
      G.current.update(dt);
      if (G.current.hud) G.hud(G.current.hud());
    }
    // 绘制
    ctx.save();
    if (FX.shakeAmt > .2) ctx.translate(U.rand(-FX.shakeAmt, FX.shakeAmt), U.rand(-FX.shakeAmt, FX.shakeAmt));
    if ((G.state === 'play' || G.state === 'pause' || G.state === 'result' || G.state === 'news') && G.current && G.current.draw) {
      G.current.draw(ctx);
    } else {
      drawIdle(ctx);
    }
    FX.draw(ctx);
    ctx.restore();
    rafId = requestAnimationFrame(tick);
  }

  function drawIdle(c) {
    var s = drawStation(c, { gap: 78, station: '西二旗', capacity: 100 });
    c.fillStyle = 'rgba(255,253,247,.55)'; c.fillRect(0, 0, W, H);
    // 站台上的众生相
    for (var i = 0; i < 9; i++) drawPerson(c, 70 + i * 105, 596, { s: .9, squash: .8, seed: i, sleep: i % 4 === 0, bag: i % 3 === 0, alpha: .7 });
  }

  function boot() {
    canvas = document.getElementById('game'); ctx = canvas.getContext('2d');
    stage = document.getElementById('stage'); overlay = document.getElementById('overlay');
    toastEl = document.getElementById('toast'); hudEl = document.getElementById('hud');
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }
    resize(); window.addEventListener('resize', resize);
    overlay.addEventListener('click', onOverlay);
    document.getElementById('btnSound').addEventListener('click', toggleSound);
    document.getElementById('btnHome').addEventListener('click', function () { G.title(); });
    document.getElementById('btnHelp').addEventListener('click', function () {
      if (G.state === 'play') { G.state = 'pause'; G._helpFromPlay = true; }
      showHelp();
    });
    bindInput();
    G.title();
    lastT = performance.now(); rafId = requestAnimationFrame(tick);
  }

  // 等所有关卡脚本注册完毕后再启动
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();

</script>
<script>
/* ==========================================================
   北京地铁挤车 · 四个关卡
   关卡接口: init / update / draw / down / move / up / key / hud
   ========================================================== */
(function () {
  'use strict';
  var B = window.BJ, U = B.U, D = B.D, FX = B.FX, sfx = B.sfx;
  var W = B.W, H = B.H, P = B.drawPerson, ST = B.drawStation;
  var INK = '#20242c', RED = '#d92b2b', YELLOW = '#f5c518', GREEN = '#2e9c6a';

  /* ---------------- 共用：主角（可逐部位缩骨） ---------------- */
  function hero(c, x, y, o) {
    o = o || {};
    var s = o.s || 1.45;
    var bw = 29 - 18 * (o.belly || 0);
    var sw = 30 - 16 * (o.shoulder || 0);
    var hw = 24 - 13 * (o.hip || 0);
    var sx = o.squash == null ? 1 : o.squash, sy = o.stretch == null ? 1 : o.stretch;
    c.save(); c.translate(x, y); c.scale(s * sx, s * sy);
    if (o.rot) c.rotate(o.rot);
    if (o.alpha != null) c.globalAlpha = o.alpha;
    // 影子
    c.fillStyle = 'rgba(32,36,44,.18)';
    c.beginPath(); c.ellipse(0, 2, 34, 8, 0, 0, Math.PI * 2); c.fill();
    // 腿
    D.poly(c, [[-18, -42], [-2, -42], [-3, -2], [-20, -2]], '#3b4759', INK, 2.4);
    D.poly(c, [[2, -42], [18, -42], [20, -2], [3, -2]], '#3b4759', INK, 2.4);
    D.poly(c, [[-23, -5], [-1, -5], [-1, 2], [-26, 2]], '#262c36', INK, 2);
    D.poly(c, [[1, -5], [23, -5], [26, 2], [1, 2]], '#262c36', INK, 2);
    // 躯干：肩 / 肚 / 胯 可独立收缩
    D.poly(c, [[-sw, -88], [sw, -88], [bw, -66], [bw, -48], [hw, -40], [-hw, -40], [-bw, -48], [-bw, -66]], '#e4654b', INK, 2.6);
    D.poly(c, [[-sw, -88], [0, -88], [0, -40], [-hw, -40], [-bw, -48], [-bw, -66]], 'rgba(0,0,0,.09)', null);
    // 手臂
    var ax = sw + 2;
    D.poly(c, [[-ax - 8, -85], [-ax + 2, -86], [-ax + 1, -44], [-ax - 9, -41]], '#e4654b', INK, 2.4);
    D.poly(c, [[ax - 2, -86], [ax + 8, -85], [ax + 9, -41], [ax - 1, -44]], '#e4654b', INK, 2.4);
    c.fillStyle = '#f3c9a0';
    c.beginPath(); c.arc(-ax - 4, -41, 6, 0, Math.PI * 2); c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.arc(ax + 4, -41, 6, 0, Math.PI * 2); c.fill(); c.stroke();
    // 头
    D.poly(c, [[-16, -118], [16, -118], [21, -105], [15, -89], [-15, -89], [-21, -105]], '#f3c9a0', INK, 2.6);
    D.poly(c, [[-19, -108], [-13, -122], [12, -122], [19, -108], [8, -113], [-8, -111]], '#2e3038', INK, 2);
    c.fillStyle = INK;
    c.beginPath(); c.arc(-7, -104, 2.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(7, -104, 2.8, 0, Math.PI * 2); c.fill();
    c.lineWidth = 2.2; c.strokeStyle = INK; c.beginPath();
    if (o.pain) { c.moveTo(-7, -95); c.lineTo(0, -100); c.lineTo(7, -95); c.stroke(); }
    else if (o.gasp) { c.ellipse(0, -95, 4, 6, 0, 0, Math.PI * 2); c.stroke(); }
    else { c.arc(0, -98, 5, .15 * Math.PI, .85 * Math.PI); c.stroke(); }
    if (o.sweat) { c.fillStyle = '#6cc4e8'; c.beginPath(); c.ellipse(24, -110, 3.5, 6, .4, 0, Math.PI * 2); c.fill(); }
    // 双肩包（未甩进去时）
    if (o.bag !== false) {
      c.save(); c.translate(-44, -68); c.rotate(o.bagRot || 0);
      D.rr(c, -13, -18, 26, 38, 8); c.fillStyle = '#d8b04a'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.4; c.stroke();
      c.beginPath(); c.moveTo(-13, -6); c.lineTo(13, -6); c.stroke();
      c.restore();
    }
    c.restore();
  }

  function button(c, x, y, w, h, text, hot, sub) {
    c.save();
    D.rr(c, x, y, w, h, 12);
    c.fillStyle = hot ? '#d92b2b' : '#fffdf7'; c.fill();
    c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    c.shadowColor = 'rgba(32,36,44,.25)'; c.shadowOffsetY = 5; c.shadowBlur = 0;
    D.T(c, text, x + w / 2, y + (sub ? 27 : h / 2 + 8), sub ? 22 : 24, hot ? '#fff' : INK, 'center');
    c.shadowColor = 'transparent';
    if (sub) D.T(c, sub, x + w / 2, y + h - 13, 12, hot ? 'rgba(255,255,255,.85)' : '#7c828d', 'center', 800);
    c.restore();
  }
  function inRect(x, y, r) { return x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]; }

  /* =========================================================
     关卡 1 · 缩骨功
     ========================================================= */
  var L1 = {
    key: 'shrink', tag: 'BONE', name: '缩骨功',
    desc: '门缝只剩 20cm，把自己拆成零件塞进去',
    brief: {
      lead: '车门即将关闭，缝隙只剩 20cm。你和车门之间，只差一点物理层面的不要脸。',
      lines: '依次点击主角身上的部位，把它「收」起来。每点对一处，门缝就会被你的不要脸撑开一点。点错？门会夹你一下，后面排队的大爷会开始现场解说。',
      quote: '🔍 线索：包比人先上车，是北京地铁第一条物理学定律。之后依次是 <b>肚子 → 肩膀 → 侧胯</b>。头和腿收不了，别费劲。',
      tip: '点击角色身上的虚线圆圈；收完四个部位后点「挤！」或按空格。'
    },
    init: function () {
      s1 = {
        t: 34, gap: 46, gapT: 46, step: 0, mistakes: 0, dignity: 100,
        shrink: { bag: 0, belly: 0, shoulder: 0, hip: 0 },
        clamp: 0, clampName: '', winT: -1, bagFly: 0,
        hx: 480, hy: 574, bubbleT: 0, shakeHero: 0, done: false
      };
      B.toast('门缝 20cm · 请先找到那个包');
    },
    update: function (dt) {
      var s = s1;
      s.t -= dt;
      s.gap = U.lerp(s.gap, s.gapT, Math.min(1, dt * 7));
      s.clamp = Math.max(0, s.clamp - dt);
      s.bubbleT += dt;
      s.shakeHero *= Math.pow(.02, dt);
      ['bag', 'belly', 'shoulder', 'hip'].forEach(function (k) {
        var target = s.shrinkOn && s.shrinkOn[k] ? 1 : 0;
        s.shrink[k] = U.lerp(s.shrink[k], s.shrinkOn && s.shrinkOn[k] ? 1 : 0, Math.min(1, dt * 8));
      });
      if (s.bagFly > 0) s.bagFly += dt;
      if (s.winT >= 0) {
        s.winT += dt;
        if (s.winT > 1.45) {
          s.winT = -2;
          B.win({
            mistakes: s.mistakes, dignity: s.dignity,
            title: s.mistakes === 0 ? '无夹通关 · 软组织工程师' : (s.mistakes < 3 ? '门缝艺术家' : '被夹出经验的人'),
            comment: s.mistakes === 0 ? '全程零夹伤。大爷没捞着开口，显得有点失落。' : '你以 ' + (20 + s.step * 5) + 'cm 的非官方宽度通过了标准车门。',
            announce: '本次列车开往……您先别急，让后面那位大爷也收收肚子。'
          });
        }
      }
      if (s.t <= 0 && s.winT < 0) B.lose({ reason: '车门关了。你还保持着收腹的姿势，站台上多了一尊雕塑。', mistakes: s.mistakes, dignity: s.dignity, taunt: '「他刚才是不是想把自己叠起来？」' });
    },
    down: function (x, y) {
      var s = s1;
      if (s.winT >= 0 || s.t <= 0) return;
      if (s.step >= 4) {
        if (inRect(x, y, [50, 500, 210, 66])) launchL1();
        return;
      }
      var parts = L1.parts();
      var hit = null, best = 1e9;
      parts.forEach(function (p) {
        var d = U.dist(x, y, p.x, p.y);
        if (d < p.r && d < best) { best = d; hit = p; }
      });
      if (!hit) return;
      var order = ['bag', 'belly', 'shoulder', 'hip'];
      if (hit.key === order[s.step]) {
        if (!s.shrinkOn) s.shrinkOn = {};
        s.shrinkOn[hit.key] = 1;
        s.step++; s.gapT += 27;
        sfx.pop(); FX.float(hit.x, hit.y - 30, ['包进去了！', '收！', '肩宽 -12cm', '侧身！'][s.step - 1], GREEN, 20);
        FX.burst(hit.x, hit.y, '#f5c518', 10, { star: true, maxSpeed: 150 });
